# File Mergify de ledger — modèle commun de l'orga (cycle PR→merge en 5 min).
#
# Deux checks requis : `ci` et `proof` (la section « ## Proof » du corps de la
# PR). La file s'appuie sur le pool d'orga (r630-ci-01..10, label
# `<projet>-worker`) : deux contrôles de file en parallèle suffisent.

queue_rules:
  - name: default
    queue_conditions:
      - check-success = ci
      - check-success = proof
      - -conflict
      - -draft
      - base = main
    batch_size:
      min: 1
      max: 3
    batch_max_wait_time: "10 seconds"
    max_checks_retries: 1
    checks_timeout: 5 min
    merge_method: squash
    update_method: rebase

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

merge_queue:
  max_parallel_checks: 2

merge_protections_settings:
  auto_merge_conditions: true

pull_request_rules:
  - name: merge when green
    conditions:
      - base = main
      - check-success = ci
      - check-success = proof
      - "#approved-reviews-by >= 0"
    actions:
      queue:
        name: default
        method: squash
  - name: ask for the proof section
    conditions:
      - base = main
      - body ~= (?m)^## Proof
    actions:
      comment:
        message: "Proof section found — thanks. It will be checked by the `proof` job."
