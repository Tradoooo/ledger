queue_rules:
  - name: default
    conditions:
      - check-success = ci
      - check-success = proof
pull_request_rules:
  - name: merge when green
    conditions:
      - base = main
      - check-success = ci
      - check-success = proof
      - "#approved-reviews-by >= 0"
    actions:
      queue:
        name: default
        method: squash
  - name: ask for the proof section
    conditions:
      - base = main
      - body ~= (?m)^## Proof
    actions:
      comment:
        message: "Proof section found — thanks. It will be checked by the `proof` job."
