name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm guards
      - run: pnpm test
      - name: contest rules (Kiro traces, MIT, public repo)
        timeout-minutes: 1
        run: |
          test -d .kiro || { echo ".kiro/ is missing"; exit 1; }
          ! grep -qE '^/?\.kiro/?$' .gitignore || { echo ".kiro is gitignored"; exit 1; }
          grep -q "MIT License" LICENSE || { echo "MIT licence missing"; exit 1; }
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofs
          path: docs/proofs.json
          retention-days: 7
