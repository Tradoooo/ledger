name: live
on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:
concurrency:
  group: live
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: three published URLs answer with a real ledger
        run: node scripts/check-live.mjs
